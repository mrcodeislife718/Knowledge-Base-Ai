name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight test dependencies
        run: python -m pip install pytest
      - name: Compile source
        run: python -m compileall -q src
      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: pytest -q
