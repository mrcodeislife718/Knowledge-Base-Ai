name: full-demo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "Dockerfile"
      - ".github/workflows/full-demo.yml"

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install OCR runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng

      - name: Install Knowledge-Base AI
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Smoke-test browser service
        run: |
          kbai-web > /tmp/kbai-web.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/api/health > /tmp/kbai-health.json; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/api/health | grep '"status":"ok"'
          curl --fail --silent http://127.0.0.1:8000/ | grep "Knowledge-Base AI"

      - name: Run full public-domain demo
        run: kbai demo

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-base-ai-demo-artifacts
          path: |
            .kbai-demo/manifests/
            .kbai-demo/inventory/
            .kbai-demo/knowledge_trees/
            .kbai-demo/validation/
            .kbai-demo/kbai.log
          if-no-files-found: warn
