name: full-demo

on:
  workflow_dispatch:

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install OCR runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng

      - name: Install Knowledge-Base AI
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run full public-domain demo
        run: kbai demo

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-base-ai-demo-artifacts
          path: |
            .kbai-demo/manifests/
            .kbai-demo/inventory/
            .kbai-demo/knowledge_trees/
            .kbai-demo/validation/
            .kbai-demo/kbai.log
          if-no-files-found: warn
