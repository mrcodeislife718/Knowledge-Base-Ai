[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "knowledge-base-ai"
version = "0.1.0"
description = "Auditable book-to-vector knowledge-base pipeline: OCR, cleanup, metadata, deduplication, semantic chunking, embeddings, Chroma retrieval, and validation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Charles Castillo" }]
dependencies = [
  "chromadb>=1.0",
  "pymupdf>=1.26",
  "sentence-transformers>=5.0",
  "typer>=0.16",
  "rich>=14.0",
  "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.12"]

[project.scripts]
kbai = "knowledge_base_ai.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_base_ai"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
