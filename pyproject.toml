[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "knowledge-base-ai"
version = "0.4.0"
description = "Auditable document-to-vector knowledge-base pipeline with OCR, provenance, Chroma retrieval, validation, telemetry, analytics, and an employer-facing operator console."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Charles Castillo" }]
dependencies = [
  "chromadb>=1.0",
  "fastapi>=0.116",
  "pymupdf>=1.26",
  "python-multipart>=0.0.20",
  "sentence-transformers>=5.0",
  "typer>=0.16",
  "rich>=14.0",
  "requests>=2.32",
  "uvicorn>=0.35",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.12"]

[project.scripts]
kbai = "knowledge_base_ai.cli:app"
kbai-web = "knowledge_base_ai.web:main"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_base_ai"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
